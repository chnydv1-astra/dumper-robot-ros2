/**:
  ros__parameters:
    use_sim_time: true
    mode: mapping

    # Frame and Topic Configuration
    map_frame: map
    odom_frame: dumper1/odom
    base_frame: dumper1/base_link
    scan_topic: /dumper1/scan

    # Ceres Solver Settings (Required by slam_toolbox)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # LiDAR Parameters
    resolution: 0.05
    max_laser_range: 30.0
    min_laser_range: 0.2
    
    # Process Limits & Thresholds
    minimum_time_interval: 0.2
    transform_publish_period: 0.05
    map_update_interval: 2.0
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    throttle_scans: 1
    enable_interactive_mode: true
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
